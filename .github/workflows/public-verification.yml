name: Public verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.12.3"
  UV_PYTHON_DOWNLOADS: never

jobs:
  quality:
    name: Quality, evidence, and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Verify dependencies and package build
        run: |
          uv lock --check
          uv sync --locked --all-groups
          uv build --no-sources
      - name: Verify Python formatting and lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
      - name: Verify current and historical public evidence
        run: |
          uv run --no-sync python -m scripts.validate_evidence
          uv run --no-sync python scripts/check_public_package.py --offline
      - name: Build checksum-bound release assets
        run: |
          uv run --no-sync python scripts/build_public_release.py \
            --output "$RUNNER_TEMP/reconcile-v0.2.0"
          cd "$RUNNER_TEMP/reconcile-v0.2.0"
          sha256sum --check --strict reconcile-v0.2.0-SHA256SUMS.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Install the network-isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Verify Terraform formatting and offline plan policy
        run: |
          terraform fmt -check -recursive infra
          profile="$RUNNER_TEMP/reconcile-ci-profile.json"
          install -m 600 /dev/null "$profile"
          printf '%s' '{"billing_account_id":"ABCDEF-123456-ABCDEF","owner_account":"ci@example.com","project_id":"reconcile-ci-123456","project_number":"123456789012","schema_version":"reconcile/deployment-profile/v1"}' > "$profile"
          chmod 400 "$profile"
          uv run --no-sync python scripts/check_phase5_terraform_plans.py \
            --deployment-profile "$profile"
          production_profile="$RUNNER_TEMP/reconcile-ci-production-profile.json"
          install -m 600 /dev/null "$production_profile"
          printf '%s' '{"billing_account_id":"ABCDEF-123456-ABCDEF","notification_channel_ids":["projects/reconcile-ci-123456/notificationChannels/123456"],"operating_profile":"production","owner_account":"ci@example.com","project_id":"reconcile-ci-123456","project_number":"123456789012","schema_version":"reconcile/deployment-profile/v2"}' > "$production_profile"
          chmod 400 "$production_profile"
          uv run --no-sync python scripts/check_phase5_terraform_plans.py \
            --deployment-profile "$production_profile"
          uv run --no-sync pytest -q tests/unit/test_phase5_terraform_plans.py

  tests:
    name: Tests / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Stateful qualification and reprovision suites remain maintainer-run.
        include:
          - name: recovery authority
            command: >-
              tests/unit/controller
              tests/unit/evidence
              tests/unit/persistence/test_permits.py
              tests/unit/persistence/test_recovery_runs.py
              tests/unit/hosted/test_firestore_permits.py
              tests/unit/hosted/test_firestore_recovery_runs.py
              tests/unit/hosted/test_recovery_cloud_run_authority.py
              tests/unit/hosted/test_runtime.py
              tests/unit/test_recovery_agents.py
              tests/unit/test_recovery_scenario.py
              tests/unit/test_recovery_workflow.py
          - name: contracts
            command: tests/contract -m contract
          - name: recovery integration
            command: >-
              tests/integration/test_hosted_recovery_actions.py
              tests/integration/test_recovery_api.py
              tests/integration/test_recovery_release_chain.py
          - name: recovery utility
            command: >-
              tests/integration/test_recovery_utility.py
              tests/unit/test_recovery_qualification_tamper.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync pytest -q ${{ matrix.command }}

  public-coverage:
    name: Public boundary coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Enforce bounded public-surface coverage
        run: >-
          uv run --no-sync pytest -q
          --cov=viewer
          --cov=scripts.build_public_release
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=75
          tests/unit/viewer
          tests/unit/test_public_evidence_export.py
          tests/unit/test_public_proof_bundle.py
          tests/unit/test_publication_verification.py
          tests/unit/test_public_release_assets.py

  gate:
    name: Public verification gate
    if: always()
    needs: [quality, tests, public-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every fast check
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          COVERAGE: ${{ needs.public-coverage.result }}
        run: test "$QUALITY" = success && test "$TESTS" = success && test "$COVERAGE" = success

  release-assets:
    name: Verified tagged release assets
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.ref_name == 'v0.2.0'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Build checksum-bound release assets
        run: |
          uv run --no-sync python scripts/build_public_release.py \
            --output "$RUNNER_TEMP/reconcile-v0.2.0" \
            --require-tag "$GITHUB_REF_NAME"
          cd "$RUNNER_TEMP/reconcile-v0.2.0"
          sha256sum --check --strict reconcile-v0.2.0-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconcile-v0.2.0-tag-${{ github.sha }}
          path: ${{ runner.temp }}/reconcile-v0.2.0
          if-no-files-found: error
          retention-days: 7

  publication:
    name: Published release and viewer
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.ref_name == 'v0.2.0'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Verify published release and retained viewer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_dir="$RUNNER_TEMP/reconcile-$RELEASE_VERSION"
          mkdir "$release_dir"
          gh release download "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir"
          uv run --no-sync python scripts/check_public_package.py
          uv run --no-sync python scripts/verify_publication.py \
            --release-directory "$release_dir" \
            --version "$RELEASE_VERSION"
