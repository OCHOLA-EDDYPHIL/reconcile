[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[project]
name = "reconcile"
version = "0.1.1"
description = "Evidence-backed reconciliation of ambiguous agent tool outcomes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "google-adk==2.6.3",
  "google-cloud-firestore==2.28.1",
  "google-cloud-run==0.16.1",
  "google-cloud-storage==3.13.1",
  "google-genai==2.18.0",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pydantic==2.13.4",
  "textual==8.2.8",
  "typer==0.27.1",
  "uvicorn==0.52.2",
]

[project.scripts]
reconcile = "reconcile.cli:main"
reconcile-api = "reconcile.interfaces.api:main"
reconcile-tui = "reconcile.interfaces.tui:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "unit: isolated deterministic behavior",
  "contract: public schema and boundary behavior",
  "integration: collaboration between local components",
  "acceptance: operator-visible local behavior",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-root = ""

[tool.reconcile.dependency-policy]
python = "3.12.13"
check = "uv lock --check"
install = "uv sync --locked --all-groups"
upgrade = "edit one exact pin; uv lock --upgrade-package <name>; review uv.lock diff"
secrets = "runtime environment or external secret store; never repository files"
